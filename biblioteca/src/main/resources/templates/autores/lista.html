
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Autores</title>
</head>
<body>
    <h1>Lista de Autores</h1>

    <a th:href="@{/autores/novo}">Cadastrar Autor</a>

    <ul>
        <li th:each="autor : ${autores}">
            <p>Nome: <span th:text="${autor.nome}"></span></p>
            <p>Email: <span th:text="${autor.email}"></span></p>
            <p>Telefone: <span th:text="${autor.telefone}"></span></p>

            <a th:href="@{/autores/excluir/{idx}(idx=${autor.id})}">
                <button type="button">Excluir</button>
            </a>
        </li>
    </ul>

    <a th:href="@{/}">Página inicial</a>
</body>
</html>
