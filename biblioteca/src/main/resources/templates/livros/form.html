
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Livro</title>
</head>
<body>
<h1>Cadastrar Livro</h1>

<form th:action="@{/livros}" th:object="${livro}" method="post">
    <label>
        Título:
        <input type="text" th:field="*{titulo}" required>
    </label>

    <br>

    <label>
        Autor:
        <input type="text" th:field="*{autor}" required>
    </label>

    <br>

    <label>
        ISBN:
        <input type="text" th:field="*{isbn}" required>
    </label>

    <br>

    <button type="submit">Cadastrar</button>
</form>

<a th:href="@{/livros}">Voltar para livros</a>
</body>
</html>
