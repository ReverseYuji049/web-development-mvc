<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>Cadastrar Livro</h1>
    <form action="/livros" method="post">
        <label>Título:
            <input type="text" th:field="*{titulo}">
        </label>

        <label>Autor:
            <input type="text" th:field="*{autor}" />
        </label>

        <label>ISBN:
            <input type="text" th:field="*{isbn}" />
        </label>

        <button type="submit">Cadastrar</button>
    </form>
</body>
</html>
